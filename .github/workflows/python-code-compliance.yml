name: Python Code Compliance

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "feature/*"
      - "**"
  pull_request:
    branches:
      - main
      - master
      - "feature/**"
      - "feature/*"

jobs:
  tests:
    name: Pruebas Unitarias (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student code
        uses: actions/checkout@v4

      - name: Checkout private tests
        uses: actions/checkout@v4
        with:
          repository: fborzi/2026-programacion-tests
          ssh-key: ${{ secrets.TESTS_DEPLOY_KEY }}
          path: private-tests-repo
          sparse-checkout: |
            shared
            tp5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        id: tests
        env:
          PYTHONPATH: .:private-tests-repo
        run: |
          python -m pytest -v private-tests-repo/tp5/test/ --junitxml=pytest-report.xml

      - name: Publish test results to Summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "# 🧪 Resultados de Pruebas Unitarias" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          echo "### 👥 Contexto de Trabajo en Parejas (Pair Programming)" >> "$SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "- **Evento:** 🔀 Pull Request" >> "$SUMMARY"
            echo "- **Rama Alumno (Origen):** \`$HEAD_REF\`" >> "$SUMMARY"
            echo "- **Rama Pareja / Destino:** \`$BASE_REF\`" >> "$SUMMARY"
            echo "- **Alumno / Autor:** @$ACTOR_NAME" >> "$SUMMARY"
            if [[ "$BASE_REF" == feature/pareja-* ]]; then
              echo "- **Etapa:** 👥 Pair Programming — Integración individual (\`$HEAD_REF\`) hacia la rama base de la pareja (\`$BASE_REF\`)" >> "$SUMMARY"
            elif [[ "$BASE_REF" == "main" || "$BASE_REF" == "master" ]]; then
              echo "- **Etapa:** ⚠️ **Atención:** La rama \`main\` no recibe merges. El destino de entrega debe ser tu rama de pareja (\`feature/pareja-apellido1-apellido2\`)." >> "$SUMMARY"
            else
              echo "- **Etapa:** 🔀 Integración hacia rama \`$BASE_REF\`" >> "$SUMMARY"
            fi
          else
            echo "- **Evento:** 🚀 Push directo" >> "$SUMMARY"
            echo "- **Rama de trabajo:** \`$REF_NAME\`" >> "$SUMMARY"
            echo "- **Alumno / Autor:** @$ACTOR_NAME" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          echo "- **Estado de Pruebas:** **$TEST_OUTCOME**" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ ! -f pytest-report.xml ]; then
            echo "_No se pudo generar el reporte de tests (pytest-report.xml no encontrado)._" >> "$SUMMARY"
          else
            python <<'PY' >> "$SUMMARY"
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("pytest-report.xml").getroot()
              total = 0
              failed = 0
              for tc in root.findall(".//testcase"):
                  total += 1
                  name = tc.attrib.get("name", "(sin nombre)")
                  cls = tc.attrib.get("classname", "")
                  label = f"{cls}::{name}" if cls else name
                  
                  failure = tc.find("failure")
                  error = tc.find("error")
                  
                  if failure is not None or error is not None:
                      failed += 1
                      node = failure if failure is not None else error
                      msg = node.attrib.get("message", "").strip()
                      detail = (node.text or "").strip()
                      print(f"- ❌ **{label}**")
                      if msg:
                          print(f"  - **Motivo:** {msg}")
                      if detail:
                          print("  - **Detalle del fallo:**")
                          print("```")
                          print(detail[:1500])
                          print("```")
                  else:
                      print(f"- ✅ {label}")
          except Exception as e:
              print(f"Error al procesar el reporte de tests: {e}")
          PY
          fi

          echo "" >> "$SUMMARY"
          echo "---" >> "$SUMMARY"
          if [ "$TEST_OUTCOME" = "success" ]; then
            DEST_NAME="${BASE_REF:-$REF_NAME}"
            echo "### ✅ Pruebas Aprobadas para Merge" >> "$SUMMARY"
            echo "Todas las pruebas unitarias pasaron con éxito. El código está listo a nivel funcional para integrarse a la rama \`$DEST_NAME\`." >> "$SUMMARY"
          else
            DEST_NAME="${BASE_REF:-$REF_NAME}"
            echo "### ❌ Pruebas con Fallos — Merge Bloqueado" >> "$SUMMARY"
            echo "Existen pruebas fallidas. No realices el merge a la rama de la pareja (\`$DEST_NAME\`) hasta corregir los ejercicios observados." >> "$SUMMARY"
          fi

      - name: Check test status
        if: steps.tests.outcome != 'success'
        run: exit 1

  compliance:
    name: Estilo y Convenciones (Compliance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout central compliance configs
        uses: actions/checkout@v4
        with:
          repository: fborzi/2026-programacion-tests
          ssh-key: ${{ secrets.TESTS_DEPLOY_KEY }}
          path: private-tests-repo
          sparse-checkout: |
            shared

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint ruff flake8 flake8-enforce-type-annotations

      - name: Run checks
        id: lint
        run: |
          set +e

          cp private-tests-repo/shared/.pylintrc .
          cp private-tests-repo/shared/.flake8 .
          cp private-tests-repo/shared/pyproject.toml .

          ruff check src/ --output-format=pylint > ruff-report.txt
          RUFF_EXIT=$?

          flake8 src/ > flake8-report.txt
          FLAKE8_EXIT=$?

          pylint src/ --output-format=parseable --score=n --reports=n > pylint-report.txt
          PYLINT_EXIT=$?

          if [ $RUFF_EXIT -ne 0 ] || [ $FLAKE8_EXIT -ne 0 ] || [ $PYLINT_EXIT -ne 0 ]; then
            exit 1
          fi

      - name: Publish report to Summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"

          echo "# 🐍 Estilo de Código (Compliance)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          echo "### 👥 Contexto de Trabajo en Parejas (Pair Programming)" >> "$SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "- **Evento:** 🔀 Pull Request" >> "$SUMMARY"
            echo "- **Rama Alumno (Origen):** \`$HEAD_REF\`" >> "$SUMMARY"
            echo "- **Rama Pareja / Destino:** \`$BASE_REF\`" >> "$SUMMARY"
            echo "- **Alumno / Autor:** @$ACTOR_NAME" >> "$SUMMARY"
            if [[ "$BASE_REF" == feature/pareja-* ]]; then
              echo "- **Etapa:** 👥 Pair Programming — Integración individual (\`$HEAD_REF\`) hacia la rama base de la pareja (\`$BASE_REF\`)" >> "$SUMMARY"
            elif [[ "$BASE_REF" == "main" || "$BASE_REF" == "master" ]]; then
              echo "- **Etapa:** ⚠️ **Atención:** La rama \`main\` no recibe merges. El destino de entrega debe ser tu rama de pareja (\`feature/pareja-apellido1-apellido2\`)." >> "$SUMMARY"
            else
              echo "- **Etapa:** 🔀 Integración hacia rama \`$BASE_REF\`" >> "$SUMMARY"
            fi
          else
            echo "- **Evento:** 🚀 Push directo" >> "$SUMMARY"
            echo "- **Rama de trabajo:** \`$REF_NAME\`" >> "$SUMMARY"
            echo "- **Alumno / Autor:** @$ACTOR_NAME" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"

          #### PYLINT ####
          echo "## Pylint" >> "$SUMMARY"
          echo "### Revisá los avisos detallados a continuación para corregir tu código." >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ ! -f pylint-report.txt ]; then
            echo "_No se generó pylint-report.txt._ ❌" >> "$SUMMARY"
          elif [ ! -s pylint-report.txt ]; then
            echo "Sin observaciones. ✅ " >> "$SUMMARY"
          else
            grep -E '^[^:]+:[0-9]+:' pylint-report.txt | head -n 200 | while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINE_NO=$(echo "$line" | cut -d: -f2)
              COL_NO=$(echo "$line" | cut -d: -f3)
              REST=$(echo "$line" | cut -d: -f4-)

              CODE=$(echo "$REST" | sed -n 's/^[[:space:]]*\([A-Z][0-9]\{4\}\).*/\1/p')
              MSG=$(echo "$REST" | sed -n 's/^[[:space:]]*[A-Z][0-9]\{4\}:[[:space:]]*\(.*\)$/\1/p')

              [ -z "$CODE" ] && CODE="pylint"
              [ -z "$MSG" ] && MSG="$REST"

              echo "- \`$FILE:$LINE_NO:$COL_NO\` **$CODE** ❌" >> "$SUMMARY"
              echo "  - $MSG" >> "$SUMMARY"
            done
          fi

          #### RUFF ####
          echo "" >> "$SUMMARY"
          echo "## Ruff" >> "$SUMMARY"
          echo "### Revisá los avisos detallados a continuación para corregir tu código." >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ ! -f ruff-report.txt ]; then
            echo "_No se generó ruff-report.txt._ ❌" >> "$SUMMARY"
          elif [ ! -s ruff-report.txt ]; then
            echo "Sin observaciones. ✅ " >> "$SUMMARY"
          else
            head -n 200 ruff-report.txt | while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINE_NO=$(echo "$line" | cut -d: -f2)
              COL_NO=$(echo "$line" | cut -d: -f3)
              REST=$(echo "$line" | cut -d: -f4-)

              CODE=$(echo "$REST" | awk '{print $1}')
              MSG=$(echo "$REST" | sed -E 's/^[[:space:]]*[A-Z0-9]+[[:space:]]+//')

              echo "- \`$FILE:$LINE_NO:$COL_NO\` **$CODE** ❌" >> "$SUMMARY"
              echo "  - $MSG" >> "$SUMMARY"
            done
          fi

          #### FLAKE8 ####
          echo "" >> "$SUMMARY"
          echo "## Flake8" >> "$SUMMARY"
          echo "### Revisá los avisos detallados a continuación para corregir tu código." >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ ! -f flake8-report.txt ]; then
            echo "_No se generó flake8-report.txt._ ❌" >> "$SUMMARY"
          elif [ ! -s flake8-report.txt ]; then
            echo "Sin observaciones. ✅ " >> "$SUMMARY"
          else
            head -n 200 flake8-report.txt | while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINE_NO=$(echo "$line" | cut -d: -f2)
              COL_NO=$(echo "$line" | cut -d: -f3)
              REST=$(echo "$line" | cut -d: -f4-)

              CODE=$(echo "$REST" | awk '{print $1}')
              MSG=$(echo "$REST" | sed -E 's/^[[:space:]]*[A-Z0-9]+[[:space:]]+//')

              echo "- \`$FILE:$LINE_NO:$COL_NO\` **$CODE** ❌" >> "$SUMMARY"
              echo "  - $MSG" >> "$SUMMARY"
            done
          fi

          echo "" >> "$SUMMARY"
          echo "---" >> "$SUMMARY"
          DEST_NAME="${BASE_REF:-$REF_NAME}"
          if [ ! -s pylint-report.txt ] && [ ! -s ruff-report.txt ] && [ ! -s flake8-report.txt ]; then
            echo "### ✅ Compliance Aprobado para Merge" >> "$SUMMARY"
            echo "El código cumple con todas las directivas de estilo y convenciones. Está listo para integrarse a la rama \`$DEST_NAME\`." >> "$SUMMARY"
          else
            echo "### ⚠️ Observaciones de Calidad Pendientes" >> "$SUMMARY"
            echo "Corregí los avisos señalados antes de mergear a la rama de la pareja (\`$DEST_NAME\`) para asegurar la calidad del código compartido." >> "$SUMMARY"
          fi

      - name: Fail if linters have issues
        if: always()
        run: |
          if [ -s pylint-report.txt ] || [ -s ruff-report.txt ] || [ -s flake8-report.txt ]; then
            echo "Se encontraron observaciones en los linters. Fallando el job de compliance."
            exit 1
          fi
